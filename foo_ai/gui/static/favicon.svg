<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Foo AI's mark: the name's F and the prompt's underscore, two cells of one
       text row. Two cells and not three, because at 16 pixels a third cell
       leaves every stroke thinner than a pixel. -->
  <defs>
    <linearGradient id="foo-ai-mark" gradientUnits="userSpaceOnUse"
                    x1="7" y1="8" x2="25" y2="24">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0d1017"/>
  <g fill="none" stroke="url(#foo-ai-mark)" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 9.5H8.5V22.5"/>
    <path d="M8.5 16H13"/>
    <path d="M19 22.5h4.5"/>
  </g>
</svg>
