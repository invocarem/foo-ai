[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foo-ai"
version = "0.1.0"
description = "A small Python coding agent."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
foo-ai = "foo_ai.cli:main"

[tool.setuptools.packages.find]
include = ["foo_ai*"]
