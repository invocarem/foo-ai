[project]
name = "foo-ai"
version = "0.1.0"
description = "Foo AI, a small coding agent for a local OpenAI-compatible model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
foo-ai = "foo_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foo_ai*"]
